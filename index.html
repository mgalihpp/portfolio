  <script>
    (function () {
      var storageKey = 'vite-ui-theme';
      var theme = localStorage.getItem(storageKey) || 'dark';
      if (theme === 'system') {
        theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.classList.add(theme);
    })();
  </script>
</head>

</body>
